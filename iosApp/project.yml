name: Acolyte
options:
  bundleIdPrefix: ch.orellbuehler
  developmentLanguage: en
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.2'

settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait'
    INFOPLIST_KEY_CFBundleDisplayName: Acolyte

targets:
  Acolyte:
    type: application
    platform: iOS
    sources:
      - path: Acolyte
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.orellbuehler.acolyte
        # Link the KMP shared framework. Gradle builds it and stages it under
        # shared/build/xcode-frameworks/<configuration>/<sdk>/ (see the shared
        # iOS framework steps in ios.yml).
        FRAMEWORK_SEARCH_PATHS:
          - '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS:
          - '-framework'
          - 'shared'
    info:
      path: Acolyte/Info.plist
      properties:
        # Only standard (exempt) encryption is used, so declare no non-exempt
        # encryption: TestFlight then skips the per-build export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - de
        # Self-hosted servers are often plain HTTP on the home network. Remote
        # servers still need valid HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Acolyte connects to your HolyArrs server on your local network.
    dependencies:
      - framework: '../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework'
        embed: false
