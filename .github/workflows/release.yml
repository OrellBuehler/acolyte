        # Manual signing: export re-signs using the Apple Distribution identity
        # imported above and the profile named in ExportOptionsTV.plist. No
        # -allowProvisioningUpdates / API key here — that path used the flaky
        # cloud-managed distribution certificate.
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AcolyteTV.xcarchive" \
            -exportOptionsPlist ExportOptionsTV.plist \
            -exportPath "$RUNNER_TEMP/export-tv"

