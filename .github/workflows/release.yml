          echo "marketing=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Set up App Store Connect API key
        id: asc_key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # xcodebuild cloud signing and `altool` both auto-discover the key at
          # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8
          echo "$API_KEY_BASE64" | openssl base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      - name: Inject team ID into ExportOptionsTV.plist
        working-directory: iosApp
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptionsTV.plist \
            || /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptionsTV.plist

      - name: Archive
        working-directory: iosApp
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
        # -allowProvisioningUpdates + the API key = cloud signing: Xcode creates
        # and manages the development cert and profile for the archive itself.
        # CODE_SIGNING_ALLOWED=YES overrides the project default (NO) used by the
        # unsigned PR/simulator build. The build number is the monotonic CI run
        # number, so every upload is unique within a marketing version.
        run: |
          xcodebuild archive \
            -project Acolyte.xcodeproj \
            -scheme AcolyteTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/AcolyteTV.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Revoke the cloud-signing development certificates
        # Cloud signing mints a fresh "Apple Development: Created via API" cert
        # on every run (the ephemeral runner never holds a previous cert's
        # private key). Apple caps development certs per team, so after ~10
        # releases Archive fails with "Your account has reached the maximum
        # number of certificates". Export re-signs with the distribution cert
        # from secrets, so the cert is dead weight once Archive is done —
        # revoke them all, including this run's, even when Archive failed.
        # Skipped only when the API key was never set up.
        if: always() && steps.asc_key.conclusion == 'success'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ASC_PRIVATE_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            node scripts/ios/revoke-ci-certs.mjs --apply

      - name: Import distribution certificate and profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.TVOS_PROFILE_APP_BASE64 }}
        # Manual export signing needs our Apple Distribution identity in a
        # keychain and the App Store profile installed where xcodebuild looks.
